<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mboka — Carte interactive de la RDC</title>
  <style>
    *{box-sizing:border-box}body{margin:0;width:1200px;height:627px;overflow:hidden;background:#f5f1e7;color:#08251f;font-family:Arial,sans-serif}.card{height:100%;display:grid;grid-template-columns:.9fr 1.1fr;position:relative}.copy{padding:58px 20px 48px 64px;display:flex;flex-direction:column;position:relative;z-index:2}.brand{display:flex;align-items:center;gap:13px;font-size:25px;font-weight:900}.mark{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:#0b5d46;color:#dbea9d}.eyebrow{margin-top:76px;color:#d85f38;font-size:13px;font-weight:900;letter-spacing:.14em}.eyebrow:before{content:"";display:inline-block;width:30px;height:3px;background:currentColor;margin:0 10px 3px 0}.copy h1{font-size:60px;line-height:.98;letter-spacing:-.055em;margin:17px 0 20px;max-width:500px}.copy h1 em{font-family:Georgia,serif;font-weight:400;color:#168b63}.copy p{font-size:19px;line-height:1.5;color:#48625a;max-width:475px}.url{margin-top:auto;display:inline-flex;align-items:center;gap:12px;font-weight:800}.url span{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#f2bd55}.visual{position:relative;background:linear-gradient(145deg,#dcece8,#b8d3db);overflow:hidden}.visual:before{content:"";position:absolute;width:430px;height:430px;border-radius:50%;background:#dbea9d;opacity:.42;right:-100px;top:-135px}.visual svg{position:absolute;inset:35px 28px 42px;width:calc(100% - 56px);height:calc(100% - 77px);filter:drop-shadow(0 18px 16px rgba(8,37,31,.18))}.province{stroke:#fffdf7;stroke-width:1.6;fill:#76a58c}.province:nth-child(4n+1){fill:#9fbd8d}.province:nth-child(4n+2){fill:#dfc270}.province:nth-child(4n+3){fill:#56856d}.province:nth-child(4n){fill:#d88d59}.territory{fill:none;stroke:#fffdf7;stroke-width:.55;opacity:.82;vector-effect:non-scaling-stroke}.badge{position:absolute;right:30px;bottom:28px;width:190px;padding:16px 18px;border-radius:14px;background:#fffdf7;box-shadow:0 12px 35px rgba(8,37,31,.2)}.badge small{display:block;color:#d85f38;font-size:10px;font-weight:900;letter-spacing:.1em}.badge strong{display:block;font-size:20px;line-height:1.15;margin-top:6px}.pill{position:absolute;left:31px;top:28px;background:#0b5d46;color:white;border-radius:999px;padding:10px 15px;font-size:11px;font-weight:800;letter-spacing:.04em}
  </style>
</head>
<body>
  <main class="card">
    <section class="copy">
      <div class="brand"><span class="mark">M</span> Mboka</div>
      <div class="eyebrow">CARTE ÉDUCATIVE INTERACTIVE</div>
      <h1>Explore la RDC,<br><em>territoire par territoire.</em></h1>
      <p>Une plateforme bilingue conçue pour apprendre, comprendre et transmettre.</p>
      <div class="url"><span>→</span> mboka.nuhar.se</div>
    </section>
    <section class="visual">
      <div class="pill">RÉPUBLIQUE DÉMOCRATIQUE DU CONGO</div>
      <svg viewBox="0 0 800 560" aria-label="Carte de la RDC"><g id="provinces"></g><g id="territories"></g></svg>
      <div class="badge"><small>À DÉCOUVRIR</small><strong>26 provinces<br>145 territoires</strong></div>
    </section>
  </main>
  <script src="../province-boundaries.js"></script>
  <script src="../territory-boundaries.js"></script>
  <script>
    document.querySelector('#provinces').innerHTML=(window.drcProvinceBoundaries||[]).map(item=>`<path class="province" d="${item.d}"></path>`).join('');
    document.querySelector('#territories').innerHTML=(window.drcTerritoryBoundaries||[]).map(item=>`<path class="territory" d="${item.d}"></path>`).join('');
  </script>
</body>
</html>
